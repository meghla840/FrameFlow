/h2>\n<label>Headline text\n<textarea id=\"head\" rows=\"3\">\u09a2\u09be\u0995\u09be\u09b0 \u09ef\u09ee \u09ac\u09be\u09b8 \u09b0\u09c1\u099f \u0995\u09ae\u09c7 \u09b9\u09ac\u09c7 \u09e9\u09e8, \u099a\u09be\u09b2\u09c1 \u09b9\u09ac\u09c7 *'\u098f\u0995 \u09b0\u09c1\u099f, \u098f\u0995 \u0995\u09cb\u09ae\u09cd\u09aa\u09be\u09a8\u09bf'* \u09ae\u09a1\u09c7\u09b2<\/textarea><\/label>\n<label>Text alignment (headline, date, lines)<input type=\"hidden\" id=\"ta\" value=\"auto\"><div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\"><button class=\"al on\" data-a=\"auto\" type=\"button\">Auto<\/button><button class=\"al\" data-a=\"l\" type=\"button\">\u2b05 Left<\/button><button class=\"al\" data-a=\"c\" type=\"button\">Center<\/button><button class=\"al\" data-a=\"r\" type=\"button\">Right \u27a1<\/button><\/div><\/label>\n<div class=\"row\">\n<label>Source label<input id=\"slabel\" value=\"Source:\"><\/label>\n<label>Source (page name or anything)<input id=\"src\" value=\"\"><\/label>\n<label>Logo position<select id=\"lpos\"><option value=\"center\">Center<\/option><option value=\"left\">Left<\/option><option value=\"right\">Right<\/option><\/select><\/label>\n<label>Source position<select id=\"spos\"><option value=\"opp\">Opposite of logo<\/option><option value=\"left\">Left<\/option><option value=\"right\">Right<\/option><\/select><\/label>\n<\/div>\n<label>Source size<input type=\"range\" id=\"ssz\" min=\"16\" max=\"40\" value=\"24\"><\/label>\n<label class=\"chk\"><input type=\"checkbox\" id=\"adate\" checked> Auto date (today)<\/label>\n<div class=\"row\">\n<label>Date<input id=\"date\" value=\"06 October 2026\"><\/label>\n<label>Text logo (used if no logo image)<input id=\"brand\" value=\"METAFEE.\"><\/label>\n<\/div>\n<div class=\"row\">\n<label>Heading gradient: start<input type=\"color\" id=\"accent\" value=\"#8f0010\"><\/label>\n<label>Heading gradient: end<input type=\"color\" id=\"accent2\" value=\"#e0202f\"><\/label>\n<label>Header background: start<input type=\"color\" id=\"bgc\" value=\"#141414\"><\/label>\n<label>Header background: end<input type=\"color\" id=\"bgc2\" value=\"#4a0a14\"><\/label>\n<label>Headline text color<input type=\"color\" id=\"tcol\" value=\"#ffffff\"><\/label>\n<\/div>\n<label>Shadow over the image<input type=\"range\" id=\"shd\" min=\"0\" max=\"100\" value=\"45\"><\/label>\n<label>Header darkness (behind the text)<input type=\"range\" id=\"hdk\" min=\"0\" max=\"100\" value=\"80\"><\/label>\n<label>Line under logo: length<input type=\"range\" id=\"ln1\" min=\"10\" max=\"100\" value=\"55\"><\/label>\n<label>Line under text: length<input type=\"range\" id=\"ln2\" min=\"10\" max=\"100\" value=\"38\"><\/label>\n<label>Line thickness<input type=\"range\" id=\"lnt\" min=\"1\" max=\"8\" step=\"0.5\" value=\"2.5\"><\/label>\n<label>Headline line spacing<div style=\"display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center\"><button class=\"alt\" id=\"lhm\" type=\"button\">\u2212<\/button><input type=\"range\" id=\"lhs\" min=\"0.9\" max=\"1.8\" step=\"0.05\" value=\"1.15\"><button class=\"alt\" id=\"lhp\" type=\"button\">+<\/button><\/div><\/label>\n<\/div>\n\n<\/div>\n<div class=\"colR\">\n<div class=\"panel plogo\">\n<h2>Top logo<\/h2>\n<label>Logo image<input type=\"file\" id=\"logo\" accept=\"image/*\"><\/label>\n<label>Top logo size<input type=\"range\" id=\"k1\" min=\"20\" max=\"250\" value=\"100\"><\/label>\n<label class=\"chk\"><input type=\"checkbox\" id=\"rm\" checked> Remove logo background<\/label>\n<label>Background removal strength<input type=\"range\" id=\"tol\" min=\"10\" max=\"120\" value=\"45\"><\/label>\n<\/div>\n\n<div class=\"panel pmedia\">\n<h2>Middle image / video<\/h2>\n<label>Image or video<input type=\"file\" id=\"media\" accept=\"image/*,video/*\"><\/label>\n<label class=\"chk\"><input type=\"checkbox\" id=\"snd\" checked> Video sound (preview)<\/label>\n<button id=\"pp\" class=\"alt\" type=\"button\">Play / Pause video<\/button>\n<\/div>\n\n<div class=\"panel pfoot\">\n<h2>Footer<\/h2>\n<label>Left logo<input type=\"file\" id=\"foot\" accept=\"image/*\"><\/label>\n<label>Left logo size<input type=\"range\" id=\"k2\" min=\"20\" max=\"250\" value=\"100\"><\/label>\n<label>Right logo (optional)<input type=\"file\" id=\"foot2\" accept=\"image/*\"><\/label>\n<label>Right logo size<input type=\"range\" id=\"k3\" min=\"20\" max=\"250\" value=\"100\"><\/label>\n<div class=\"row\">\n<label>Center text<input id=\"fmid\" value=\"\"><\/label>\n<label>Right text (if no right logo)<input id=\"ftext\" value=\"www.metafee.com\"><\/label>\n<\/div>\n<label>Footer color<input type=\"color\" id=\"fbg\" value=\"#3a3a3a\"><\/label>\n<\/div>\n\n<div class=\"panel pdl\">\n<h2>Download<\/h2>\n<button id=\"dlimg\">Download image (PNG)<\/button>\n<button id=\"dlvid\" class=\"alt\">Download video (MP4)<\/button>\n<div id=\"st\"><\/div>\n<\/div>\n<div class=\"dock\" id=\"dock\">\n<h2 class=\"dh\">Edit image / video<\/h2>\n<div class=\"dbody\">\n<div class=\"dp\" data-t=\"z\"><div class=\"dr\"><span>Zoom<\/span><b id=\"vz\">100%<\/b><\/div><input type=\"range\" id=\"mz\" min=\"20\" max=\"400\" value=\"100\"><\/div>\n<div class=\"dp\" data-t=\"r\" hidden><div class=\"dr\"><span>Rotate<\/span><b id=\"vr\">0\u00b0<\/b><\/div><div class=\"dgo\"><input type=\"range\" id=\"mr\" min=\"-180\" max=\"180\" value=\"0\"><button class=\"alt rb\" id=\"br9\" type=\"button\">+90\u00b0<\/button><\/div><\/div>\n<div class=\"dp\" data-t=\"m\" hidden><div class=\"dr\"><span>Left / Right<\/span><\/div><input type=\"range\" id=\"mpx\" min=\"-100\" max=\"100\" value=\"0\"><div class=\"dr\"><span>Up / Down<\/span><\/div><input type=\"range\" id=\"mpy\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n<div class=\"dp\" data-t=\"v\" data-l=\"Video edit\" hidden>\n<div class=\"tl\" id=\"tl\"><div class=\"ph\" id=\"ph\"><\/div><\/div>\n<input type=\"range\" id=\"scrub\" min=\"0\" max=\"1000\" value=\"0\">\n<div class=\"dr\"><span id=\"tcur\">0:00.0<\/span><b id=\"tinfo\">Output 0:00.0<\/b><\/div>\n<div class=\"dvb\"><button class=\"alt\" id=\"vsplit\" type=\"button\">Split<\/button><button class=\"alt\" id=\"vdel\" type=\"button\">Delete<\/button><button class=\"alt\" id=\"vts\" type=\"button\">Trim start<\/button><button class=\"alt\" id=\"vte\" type=\"button\">Trim end<\/button><\/div>\n<div class=\"dvb\"><button id=\"vpp\" type=\"button\">Play / Pause<\/button><button class=\"alt\" id=\"vn1\" type=\"button\">\u25c0 0.1s<\/button><button class=\"alt\" id=\"vn2\" type=\"button\">0.1s \u25b6<\/button><button class=\"alt\" id=\"vrs\" type=\"button\">Reset<\/button><\/div>\n<\/div>\n<div class=\"dp\" data-t=\"f\" data-l=\"Fit\" hidden><div class=\"dfit\"><button id=\"bfw\" type=\"button\">Fit width<\/button><button id=\"bfa\" type=\"button\">Fill area<\/button><button class=\"alt\" id=\"brs\" type=\"button\">Reset<\/button><\/div><\/div>\n<\/div>\n<div class=\"dtabs\">\n<button class=\"dt\" data-t=\"z\" type=\"button\"><svg viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m21 21-4.3-4.3M11 8v6M8 11h6\"/><\/svg>Zoom<\/button>\n<button class=\"dt\" data-t=\"r\" type=\"button\"><svg viewBox=\"0 0 24 24\"><path d=\"M21 12a9 9 0 1 1-3-6.7L21 8\"/><path d=\"M21 3v5h-5\"/><\/svg>Rotate<\/button>\n<button class=\"dt\" data-t=\"m\" type=\"button\"><svg viewBox=\"0 0 24 24\"><path d=\"m5 9-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20\"/><\/svg>Move<\/button>\n<button class=\"dt\" data-t=\"f\" type=\"button\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3\"/><\/svg>Fit<\/button>\n<button class=\"dt\" data-t=\"v\" id=\"tabv\" type=\"button\" hidden><svg viewBox=\"0 0 24 24\"><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/><\/svg>Edit<\/button>\n<\/div><\/div>\n<\/div>\n<\/div>\n<script src=\"https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js\"><\/script>\n<script>\nconst FF=()=>`\"${$('fen').value}\",\"${$('fbn').value}\",sans-serif`;\nconst W=1080,H=1350,cv=document.getElementById('c');let x=cv.getContext('2d');const mainX=x;let dirty=true;\nconst $=id=>document.getElementById(id);\nlet vidFile=null,ov=null,logoImg=null,footImg=null,foot2Img=null,mImg=null,vid=null,recording=false;\nlet actx=null,dst=null,mon=null;\nfunction setupAudio(v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();dst=actx.createMediaStreamDestination();\n const src=actx.createMediaElementSource(v);mon=actx.createGain();mon.gain.value=$('snd').checked?1:0;src.connect(dst);src.connect(mon);mon.connect(actx.destination);actx.resume()}catch(e){dst=null}}\nfunction loadImg(file,cb){const i=new Image();i.onload=()=>{cb(i);dirty=true};i.src=URL.createObjectURL(file)}\n$('logo').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],i=>{logoImg=i});\n$('foot2').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],i=>{foot2Img=i});\n$('foot').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],i=>{footImg=i});\n$('media').onchange=e=>{const f=e.target.files[0];if(!f)return;\n if(vid){vid.pause();vid=null}$('tabv').hidden=true;document.body.classList.remove('hasvid');segs=[];if(typeof curTab!=='undefined'&&curTab==='v')openTab('z');mImg=null;\n if(f.type.startsWith('video')){vidFile=f;const v=document.createElement('video');v.src=URL.createObjectURL(f);v.loop=true;v.playsInline=true;v.preload='auto';v.onloadeddata=()=>{vid=v;dur=v.duration;segs=[{s:0,e:dur}];$('tabv').hidden=false;document.body.classList.add('hasvid');renderTL();setupAudio(v);v.play().catch(()=>{$('st').textContent='Tap Play / Pause to start the video'})};}\n else loadImg(f,i=>{mImg=i});};\nfunction cover(src,sw,sh,dx,dy,dw,dh){const s=Math.max(dw/sw,dh/sh),w=sw*s,h=sh*s;\n x.save();x.beginPath(
